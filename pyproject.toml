[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mewhelp"
version = "0.1.0"
description = "Function-calling customer support demo"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
    "PyMySQL>=1.1",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["app*"]
